      - name: Install and start VNC server
        run: |
          brew install --cask tigervnc-viewer
          brew install tigervnc-server
          # Start a VNC server on display :1
          vncserver :1 -geometry 1280x720 -depth 24
          # Forward port 5901 via cloudflared (free, no account needed)
          brew install cloudflared
          cloudflared tunnel --url http://localhost:5901 &
          sleep 10
          # Print the tunnel URL from logs (or use ngrok with auth token)
          grep -o 'https://.*trycloudflare.com' nohup.out | head -1
