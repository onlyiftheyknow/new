name: iPhone Simulator Live Stream

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'How long to keep alive (minutes, max 360)'
        required: true
        default: '60'
      url:
        description: 'URL to open in Safari'
        required: false
        default: 'https://example.com'

jobs:
  live-simulator:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Boot iOS Simulator and Stream
        run: |
          # Get a valid device type identifier
          DEVICE_TYPE=$(xcrun simctl list devicetypes | grep -m1 'iPhone' | sed -E 's/.*\(([^)]+)\)/\1/')
          echo "Using device type: $DEVICE_TYPE"

          # Create simulator
          UDID=$(xcrun simctl create "GhostPhone" "$DEVICE_TYPE")
          echo "Simulator UDID: $UDID"

          # Boot and wait
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "Simulator booted."

          # Open Safari
          xcrun simctl openurl "$UDID" "${{ github.event.inputs.url }}"

          # Start screenshot loop in background
          mkdir -p ~/screenshots
          (
            while true; do
              xcrun simctl io "$UDID" screenshot ~/screenshots/screen.png
              sleep 10
            done
          ) &

          # Serve screenshots via HTTP
          cd ~/screenshots
          nohup python3 -m http.server 8080 > /tmp/http.log 2>&1 &

          # Expose HTTP port via cloudflared (free, no account)
          brew install cloudflared
          nohup cloudflared tunnel --url http://localhost:8080 > /tmp/cloudflared.log 2>&1 &
          sleep 15  # wait for tunnel to establish

          # Extract the public URL from cloudflared log
          PUBLIC_URL=$(grep -o 'https://[a-zA-Z0-9.-]*trycloudflare.com' /tmp/cloudflared.log | head -1)
          echo "========================================="
          echo "LIVE SIMULATOR VIEW URL: $PUBLIC_URL"
          echo "Open that URL in your PC browser. It auto-refreshes every 10 seconds."
          echo "========================================="

          # Keep alive for the requested duration
          DURATION_MINUTES=${{ github.event.inputs.duration }}
          echo "Keeping alive for $DURATION_MINUTES minutes..."
          sleep $((DURATION_MINUTES * 60))

          # Final screenshot
          xcrun simctl io "$UDID" screenshot final.png
          echo "Final screenshot saved."

      - name: Upload final screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-screenshot
          path: final.png
          retention-days: 7

      - name: Interactive SSH via tmate (optional)
        if: always()
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          timeout-minutes: 30
